[package]
name = "wlmstr"
version = "0.8.0"
edition = "2024"

[[bin]]
name = "wlmstr"
path = "src/main.rs"

# [profile.release]
# opt-level = 3     # デフォルト。サイズ優先なら "s"/"z"
# lto = "fat"       # クレート横断のインライン化。"thin" は速度と時間の妥協点
# codegen-units = 1 # 並列コンパイルを捨てて最適化品質を上げる
# panic = "abort"   # 巻き戻しコードを削除
# strip = "symbols" # バイナリ縮小（速度への寄与は間接的）

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
itertools = "0.15"
rand = "0.10.1"
easy_storage = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
procfs = "0.18"
libc = "0.2.186"
